[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-registry"
version = "1.0.0"
description = "Harness/agent/transport-agnostic on-demand skill registry (skills.sh as live source)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
skill-registry-mcp = "skill_registry.server:main"

[tool.setuptools.packages.find]
where = ["python"]
